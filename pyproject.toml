[project]
name = "py10x-core"
description = "10x Platform Core"
dynamic = ["version"]
authors = [
    { name = "10X CONCEPTS LLC", email = "py10x@10x-software.org" },
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "py10x-kernel (>=0.3.3rc4,<0.3.3rc5)",
    "py10x-infra (>=0.3.3rc4,<0.3.3rc5)",
    "importlib-resources (>=6.5.2,<6.6.0)",
    "numpy>=2.2.2,<2.5.0",
    "python-dateutil (>=2.9.0,<2.10.0)",
    "cryptography>=45.0.7,<50.1.0",
    "pymongo (>=4.7.3)",
    "typing-extensions>=4.15.0",
    "scipy>=1.15.3",
    "keyring>=25.6.0",
    "requests>=2.32.5",
    "hatchling>=1.27.0",
    "hatch-build-scripts>=1.0.0",
    "polars>=1.38.1",
    "ibis-framework[postgres]>=12.0.0",
    "sqlglot>=23.4,<30.16",  # 30.16+ emits invalid Postgres SQL for ibis UnwrapJSON empty-path extract
    "adbc-driver-manager>=1.10.0",
    "psutil>=5.9.7",
    "uuid6>=2025.0.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
dev = [
    "alt-pytest-asyncio==0.9.5",
    "asyncio-atexit>=1.0.1,<2.0",
    "hatchling>=1.27.0",
    "hatch-build-scripts>=1.0.0",
    "licensecheck>=2025.1.0",
    "playwright>=1.55,<1.63",
    #"pre-commit>=3.1,<5.0",
    "pytest>=8.3.4,<10.0",
    "pytest-cov>=6.0,<8.0",
    "pytest-mock>=3.5.11,<4.0.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.13,<0.17",
    "setuptools-scm>=9.2.2",
    "tomlkit>=0.13.0",
    "packaging>=24.0", # version/specifier logic for xx-promote
    "uv>=0.13.4; python_version < '3.12'", # 3.11 gets licensecheck 2025.x, which depends on uv: keep it within [tool.uv] required-version
    "ibis-framework[duckdb]>=12.0.0",
    "duckdb<2", # 2.0 raises ResourceInUseException ("unfinished result from execute()") in IbisStore
    "adbc-driver-manager>=1.10.0",
    "scikit-build-core>=0.12.2", # C++ build backend (incremental, no-isolation)
    "cmake>=3.27", # persistent toolchain for import-time incremental rebuilds
    "ninja>=1.11", # persistent toolchain for import-time incremental rebuilds (Linux/macOS)
    "editables>=0.6", # editable install support
]
rio = [
    "rio-ui==0.12.3",
    "matplotlib>=3.10.6,<3.12.0",
    "webview-proc>=0.1.0rc6",
    "aiofiles>=24.1",
]
qt = [
    "PyQt6 (==6.8.1)",
    "PyQt6-Qt6 (==6.8.2)",
    "PyQt6_sip (==13.10.0)",
]
jit = [
    "jax>=0.10.1",
    "numba>=0.65.1",
    "cython>=3.2.4",
    "tccbox>=2025.10.27",
]
aadc = [
    "aadc>=2.22.2",
]
examples = [
    "yfinance>=1.7.0", # ui_10x/examples/price_simulator.py only
    "pandas!=3.0.4",   # crashes with yfinance
]

[project.urls]
Homepage = "https://github.com/10x-software/py10x"
Repository = "https://github.com/10x-software/py10x"
Issues = "https://github.com/10x-software/py10x/issues"
Documentation = "https://github.com/10x-software/py10x#readme"

[project.entry-points.pytest11]
py10x_core = "dev_10x.pytest_plugin"

[project.scripts]
uv-sync                         = "dev_10x.uv_sync:main"
uv-run                          = "dev_10x.uv_run:main"
xx-constraints                  = "dev_10x.constraints:main"
xx-promote                      = "dev_10x.xx_promote:XxPromoteCli.main"
xx-test-postgres-auth           = "dev_10x.postgres_local:PostgresAuthCli.main"
xx-test-db-clean                = "dev_10x.db_clean:TestDbCleanCli.main"
xx-user-init                    = "core_10x.apps.user_init:UserInitCli.main"
xx-functional-account-init      = "core_10x.apps.functional_account_init:FunctionalAccountInitCli.main"
xx-user-status                  = "core_10x.apps.user_status:UserStatusCli.main"
xx-user-save-credentials        = "core_10x.apps.user_save_credentials:main"
xx-admin-save-user-credentials  = "core_10x.apps.admin_save_user_credentials:main"
xx-vault-setup-roles            = "core_10x.apps.vault_setup_roles:VaultSetupRolesCli.main"

[build-system]
requires = ["hatchling>=1.17.0","hatch-vcs","hatch-build-scripts","playwright>=1.55,<1.63"]
build-backend = "hatchling.build"

# `footprint` (git pathspecs) replaces the default "repo minus other packages' dirs" footprint:
# the C++ packages share cxx10x/ build files but not core's Python.
[tool.dev_10x.siblings]
py10x-kernel = { path = "cxx10x/core_10x", footprint = ["cxx10x", ":(exclude)cxx10x/infra_10x", ".github/workflows/cxx10x_wheels.yml", ".github/actions/build-wheels"] }
py10x-infra  = { path = "cxx10x/infra_10x", footprint = ["cxx10x", ":(exclude)cxx10x/core_10x", ".github/workflows/cxx10x_wheels.yml", ".github/actions/build-wheels"] }

[tool.dev_10x.downstream]
py10x-fin-base = { path = "./xx_fin" }

[tool.uv]
required-version = ">=0.12.5"
# Rebuild py10x-core (rather than reuse uv's cached wheel) on a new commit or tag, so its installed
# hatch-vcs version (and dev_10x/version.py) stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
no-build-isolation-package = ["py10x-kernel", "py10x-infra", "py10x-fin-base-cxx"]
# Plain `uv sync` installs the full dev environment (fresh clone: `./xx-build init` first).
default-groups = ["dev", "extras", "test", "test-extras"]

# The in-tree packages, editable: plain `uv sync` / `uv run` install kernel/infra (C++: incremental,
# rebuild-on-import) and fin-base (the `test` groups) from this tree; fin-base-cxx comes editable via
# xx_fin's own workspace source. uv takes path sources as-is, regardless of version pins on them; the
# release workflows install tagged / non-editable builds with `--override`, which wins over these.
# Sources rather than a workspace: xx_fin/ has its own workspace, and uv does not nest workspaces.
[tool.uv.sources]
py10x-kernel = { path = "cxx10x/core_10x", editable = true }
py10x-infra = { path = "cxx10x/infra_10x", editable = true }
py10x-fin-base = { path = "xx_fin", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["core_10x", "dev_10x", "infra_10x", "ui_10x", "xxcommon"]
exclude = ["**/manual_tests"]

# Without this the sdist ships every non-ignored file, incl. the cxx10x/ and xx_fin/ packages.
[tool.hatch.build.targets.sdist]
only-include = ["core_10x", "dev_10x", "infra_10x", "ui_10x", "xxcommon", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]
exclude = ["**/manual_tests"]

[[tool.hatch.build.hooks.build-scripts.scripts]]
commands = [ "playwright install chromium" ]

[tool.hatch.version]
source = "vcs"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'" }

[tool.hatch.build.hooks.vcs]
version-file = "dev_10x/version.py"

[dependency-groups]
# C++ build toolchain for the non-isolated kernel/infra/cxxfin builds. `./xx-build init` installs it
# (from uv.lock) before anything is built: uv does not order a no-isolation build after its
# toolchain. Same packages as in `dev`; scikit-build-core capped like py10x-kernel's runtime dep.
build = [
    "scikit-build-core>=0.12.2,<1.0.0",
    "setuptools-scm>=9.2.2",
    "cmake>=3.27",
    "ninja>=1.11",
    "editables>=0.6",
]
dev = ["py10x-core[dev]"]
extras = ["py10x-core[rio,qt,jit,aadc,examples]"]
test = ["py10x-fin-base>=0.1.3rc4"]
# Fin-base's extras for its tests, kept out of `test` (whose pin xx-promote rewrites); the version
# comes from `test`. Lets uv.lock / constraints.txt cover blpapi, xbbg, aadc like `--all-extras` did.
test-extras = ["py10x-fin-base[bbg,aadc,dev]"]
