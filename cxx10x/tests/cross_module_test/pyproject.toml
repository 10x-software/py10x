[project]
name = "cross-module-test"
description = "Minimal test extension that exercises cross-module pybind11 types from py10x-kernel"
requires-python = ">=3.11,<3.14"
dynamic = ["version"]
dependencies = [
    "py10x-core[dev]",
    "py10x-kernel",
    "py10x-infra",
]

[build-system]
requires = [
    "scikit-build-core>=0.10.7",
    "setuptools-scm>=9.2.2",
    "pybind11-stubgen==2.5.5",
    "py10x-kernel"
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
editable.rebuild = true
build-dir = ".venv/py10x-build/cross-module-test/{build_type}/{wheel_tag}"

# Same MSVC toolset pin as py10x-kernel (Py10xMsvcVersion.cmake requires MSVC_VERSION=1944).
[[tool.scikit-build.overrides]]
if.platform-system = "^win"
cmake.args = ["-T", "v143,version=14.44"]

[tool.setuptools_scm]
root = "../../.."  # the git root
git_describe_command = "git describe --dirty --tags --long --match 'cross-module-test-v*' --abbrev=8"

[tool.uv.sources]
py10x-kernel = {path="../../core_10x", editable=true}
py10x-infra = {path="../../infra_10x", editable=true}
py10x-core = {path="../../..", editable=true}

[tool.uv]
required-version = ">=0.12.5"
no-build-isolation-package = ["py10x-kernel", "py10x-infra", "cross-module-test"]
reinstall-package = ["py10x-kernel", "py10x-infra", "cross-module-test"]
concurrent-builds = 1

# Kernel/infra build into this venv (not py10x/.venv); paths are relative to each package's source dir.
[tool.uv.config-settings-package]
py10x-kernel = { "build-dir" = "../tests/cross_module_test/.venv/py10x-build/py10x-kernel/{build_type}/{wheel_tag}" }
py10x-infra = { "build-dir" = "../tests/cross_module_test/.venv/py10x-build/py10x-infra/{build_type}/{wheel_tag}" }
