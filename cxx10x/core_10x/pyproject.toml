[project]
name = "py10x-kernel"
description = "10X Platform Core Kernel"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dynamic = ["version"]

authors = [
    { name = "10X CONCEPTS LLC", email = "py10x@10x-software.org" },
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Development Status :: 4 - Beta",
]

dependencies = [
    "uuid6>=2025.0.1",
    "scikit-build-core>=0.10.7,<1.0.0", # version 1.0 breaks dependent package build on windows, so pin here until fixed
]

[project.urls]
Homepage = "https://10x-software.org"

[build-system]
requires = [
    "scikit-build-core>=0.10.7",
    "setuptools-scm>=9.2.2",
    "pybind11-stubgen==2.5.5",  # post-build .pyi generation (cxx10x/cmake/PybindStubs.cmake)
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
build-dir = "../../build/py10x-build/py10x-kernel/{build_type}/{wheel_tag}"
cmake.build-type = "Debug"
editable.rebuild = true
editable.verbose = false

[tool.scikit-build.cmake.define]
XX_CXX_SANITIZERS = {env = "XX_CXX_SANITIZERS", default = "OFF"}

[[tool.scikit-build.overrides]]
if.platform-system = "^win"
cmake.args = ["-T", "v143,version=14.44"]

# cibuildwheel builds in isolation: throwaway build dir, no rebuild (it needs a persistent one).
# Published wheels are always Release, whatever the local default above is.
[tool.cibuildwheel]
config-settings = { "build-dir" = "", "editable.rebuild" = "false", "cmake.build-type" = "Release" }

# uv rebuilds this package (instead of reusing its cached wheel) when this file or the sanitizer
# switch, which CMake reads from the env, changes. Not on a new commit or tag: a pull would then
# rebuild every C++ package at once, racing (py10x-fin-base-cxx's build imports the kernel, which
# rebuilds on import in the build dir uv is reconfiguring). Source edits rebuild on import anyway;
# the setuptools-scm version stays at the last `./xx-build init` / `set-mode` / `rebuild`.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { env = "XX_CXX_SANITIZERS" }]

[tool.setuptools_scm]
root = "../.."
git_describe_command = "git describe --dirty --tags --long --match 'py10x-kernel-*' --abbrev=40"
