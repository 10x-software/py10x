[project]
name = "py10x-kernel"
description = "10X Platform Core Kernel"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dynamic = ["version"]

authors = [
    { name = "10X CONCEPTS LLC", email = "py10x@10x-software.org" },
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Development Status :: 4 - Beta",
]

dependencies = [
    "uuid6>=2025.0.1",
    "scikit-build-core>=0.10.7,<1.0.0", # version 1.0 breaks dependent package build on windows, so pin here until fixed
]

[project.urls]
Homepage = "https://10x-software.org"

[build-system]
requires = [
    "scikit-build-core>=0.10.7",
    "setuptools-scm>=9.2.2",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
# Local-build defaults = uv-sync's default mode (incremental_quiet): build type, persistent CMake
# cache and rebuild-on-import, quietly. uv-sync's other XX_UV_INSTALL_MODEs and scikit-build-core's
# SKBUILD_* env vars (e.g. SKBUILD_CMAKE_BUILD_TYPE=Debug) override them. Requires a non-isolated build - an isolated one bakes its throwaway cmake/ninja
# paths into CMakeCache.txt; py10x's [tool.uv] no-build-isolation-package and uv-sync cover that.
# Consumers may override build-dir (e.g. xx-fin-domain keeps its own).
build-dir = "../../.venv/py10x-build/py10x-kernel/{build_type}/{wheel_tag}"
cmake.build-type = "Release"
editable.rebuild = true
editable.verbose = false

[tool.scikit-build.cmake.define]
ENABLE_SANITIZERS = {env = "ENABLE_SANITIZERS", default = "OFF"}

[[tool.scikit-build.overrides]]
if.platform-system = "^win"
cmake.args = ["-T", "v143,version=14.44"]

# cibuildwheel builds in isolation: throwaway build dir, no rebuild (it needs a persistent one).
# Published wheels are always Release, whatever the local default above is.
[tool.cibuildwheel]
config-settings = { "build-dir" = "", "editable.rebuild" = "false", "cmake.build-type" = "Release" }

[tool.setuptools_scm]
root = "../.."
git_describe_command = "git describe --dirty --tags --long --match 'py10x-kernel-*' --abbrev=40"
