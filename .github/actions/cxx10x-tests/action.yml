name: cxx10x tests
description: Run the cxx10x/tests harness suites against editable in-tree kernel/infra and core
inputs:
  python-version:
    description: Python version to install via uv
    required: false
    default: "3.12"
  mongodb-version:
    description: MongoDB major.minor for Linux (Docker) and Windows (preinstalled Server path)
    required: false
    default: "7.0"
runs:
  using: composite
  steps:
    - name: Set up Python
      shell: bash
      run: |
        uv python install ${{ inputs.python-version }}
        # Pin every subsequent uv invocation (uv run / uv venv / uv sync) to the matrix
        # interpreter, otherwise uv is free to pick any version satisfying requires-python.
        echo "UV_PYTHON=${{ inputs.python-version }}" >> "$GITHUB_ENV"

    - name: Setup Windows build
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-windows-build

    - name: Setup Mongo standalone
      uses: ./.github/actions/setup-mongo-standalone
      with:
        mongodb-version: ${{ inputs.mongodb-version }}

    # Same run-once preparation as each harness README: py10x-core[dev] (C++ build toolchain) first;
    # `uv run` then syncs the rest.
    - name: Run kernel test harness
      shell: bash
      working-directory: cxx10x/tests/py10x_kernel_test
      run: |
        uv venv --clear
        uv pip install -e "../../..[dev]"
        uv run python ../../core_10x/tests/test.py
        # Incremental rebuild after a C++ edit: on import (no sync), then via `uv run`'s sync.
        uv run --no-sync python ../assert_rebuilt.py py10x_kernel ../../core_10x/tid.cpp -- uv run --no-sync python ../../core_10x/tests/test.py
        uv run --no-sync python ../assert_rebuilt.py py10x_kernel ../../core_10x/tid.cpp -- uv run python ../../core_10x/tests/test.py

    - name: Run infra test harness
      shell: bash
      working-directory: cxx10x/tests/py10x_infra_test
      run: |
        uv venv --clear
        uv pip install -e "../../..[dev]"
        uv run python ../../infra_10x/tests/test.py
        # Incremental rebuild after a C++ edit: on import (no sync), then via `uv run`'s sync.
        uv run --no-sync python ../assert_rebuilt.py py10x_infra ../../infra_10x/mongo_collection_helper.cpp -- uv run --no-sync python ../../infra_10x/tests/test.py
        uv run --no-sync python ../assert_rebuilt.py py10x_infra ../../infra_10x/mongo_collection_helper.cpp -- uv run python ../../infra_10x/tests/test.py

    - name: Run cross-module tests
      shell: bash
      working-directory: cxx10x/tests/cross_module_test
      run: |
        uv venv --clear
        uv pip install -e "../../..[dev]"
        uv run python test.py
        touch pyproject.toml
        uv sync --upgrade
        uv run python test.py
        # Incremental rebuild after a C++ edit: on import (no sync), then via `uv run`'s sync.
        uv run --no-sync python ../assert_rebuilt.py cross_module_test cross_module_test.cpp -- uv run --no-sync python test.py
        uv run --no-sync python ../assert_rebuilt.py cross_module_test cross_module_test.cpp -- uv run python test.py
