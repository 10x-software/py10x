name: CI test suite
description: >-
  Install cxx siblings, verify constraints, assert core isolation (xxfin absent),
  MongoDB, Playwright, run core pytest, then install fin-base (--with-downstream)
  and run xx_fin tests. With asan=true, build the cxx10x backend - kernel and the
  downstream fin-base/cxxfin - under AddressSanitizer and run both the core suite
  and the xx_fin tests under it (nightly memory-error diagnostics), capturing a
  symbolized C++ report on any fault. With asan=false (default), build/test the
  standard release configuration.
inputs:
  python-version:
    description: Python version to install via uv
    required: true
    default: "3.12"
  mongodb-version:
    description: MongoDB major.minor for Linux (Docker) and Windows (preinstalled Server path)
    required: true
    default: "7.0"
  runner-os:
    description: Host runner OS from the calling workflow (Linux, Windows, or macOS)
    required: true
  asan:
    description: 'Build + run under AddressSanitizer ("true"/"false"). Nightly diagnostics only.'
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Setup Windows build
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-windows-build

    - name: Enable AddressSanitizer build
      if: inputs.asan == 'true'
      shell: bash
      run: |
        echo "XX_CXX_SANITIZERS=ON" >> "$GITHUB_ENV"

    # CI keeps plain editable C++ installs instead of the incremental default: nothing is edited
    # after install, so per-import rebuild checks in every xdist worker would be pure overhead.
    # Not `normal` either - cxxfin finds kernel headers via the editable install; a non-editable
    # kernel makes it fetch them by commit hash, which fails for a PR's merge commit.
    - name: Install dependencies
      shell: bash
      run: |
        echo "XX_UV_INSTALL_MODE=editable" >> "$GITHUB_ENV"
        export XX_UV_INSTALL_MODE=editable
        # Explicit, so a change to the packages' default cmake.build-type doesn't reach CI.
        echo "SKBUILD_CMAKE_BUILD_TYPE=Release" >> "$GITHUB_ENV"
        export SKBUILD_CMAKE_BUILD_TYPE=Release
        uv venv
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        python -m dev_10x.uv_sync py10x-dev --all-extras
        # Assert the result, not just the exit code: kernel/infra editable from this tree, no
        # rebuild-on-import, Release (uv can quietly install something else - see dev_10x/env_check.py).
        # No import under ASan: an instrumented module only loads under the ASan harness (see below).
        python -m dev_10x.env_check ${{ inputs.asan == 'true' && '--no-import' || '' }}

    # uv-sync applies -c constraints.txt on every install, so the test env is frozen. Assert every
    # installed third-party dist is pinned (catches a py10x or sibling dep that escaped the freeze).
    - name: Verify env is fully frozen against constraints.txt
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        xx-constraints check

    # constraints.txt is generated from the committed uv.lock (`xx-constraints compile`): fail if
    # someone edited one without regenerating the other.
    - name: Verify constraints.txt matches uv.lock
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        xx-constraints check-export

    # uv.lock must be current with every pyproject (pin bumps lock in the same commit: xx-promote and
    # `xx-constraints compile` both run `uv lock`). Read-only: fails instead of rewriting the lock.
    - name: Verify uv.lock is up to date
      shell: bash
      run: uv lock --check

    # Core isolation: fin-base must not be importable until --with-downstream (after core pytest).
    - name: Assert xxfin not importable (core isolation)
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        python -c "import xxcommon; import importlib.util as u; assert u.find_spec('xxfin') is None, 'xxfin must not be importable in the core CI env'"

    - name: Verify the extension is ASan-instrumented
      if: inputs.asan == 'true'
      shell: bash
      run: |
        set -euo pipefail
        pyd="$(find .venv \( -name 'py10x_kernel*.pyd' -o -name 'py10x_kernel*.so' \) 2>/dev/null | head -1)"
        [ -n "$pyd" ] || { echo "py10x_kernel extension not found under .venv"; exit 1; }
        echo "extension: $pyd"
        if [ "${{ inputs.runner-os }}" = "Windows" ]; then
          # The instrumented .pyd imports clang_rt.asan_dynamic-x86_64.dll; the name sits in its
          # import table as a literal ASCII string.
          grep -aq 'clang_rt\.asan' "$pyd" || { echo "ERROR: not ASan-instrumented (no clang_rt.asan import)"; exit 1; }
        else
          # An instrumented .so references libasan's __asan_init interceptor as an undefined symbol.
          nm -D "$pyd" | grep -q '__asan_init' || { echo "ERROR: not ASan-instrumented (no __asan_init)"; exit 1; }
        fi
        echo "OK: extension is ASan-instrumented"

    - name: Setup Mongo replica set
      uses: ./.github/actions/setup-mongo-replica-set
      with:
        mongodb-version: ${{ inputs.mongodb-version }}

    - name: Setup PostgreSQL
      uses: ./.github/actions/setup-postgres

    - name: Install Playwright chromium
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        timeout 600 playwright install --with-deps chromium

    - name: Stage ASan runtime next to the .pyd
      if: inputs.asan == 'true' && inputs.runner-os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        venv="${GITHUB_WORKSPACE}/.venv"
        # Python 3.8+ won't load an extension's dependency DLLs from PATH (only system/exe/.pyd dirs),
        # so copy the clang_rt ASan runtime next to every .pyd and the venv Scripts dir. (PDBs are
        # already installed beside each .pyd, so cdb symbolizes from there.)
        asan="$(find "$VCToolsInstallDir" -name 'clang_rt.asan_dynamic-x86_64.dll' 2>/dev/null | head -1)"
        [ -n "$asan" ] || { echo "clang_rt.asan_dynamic-x86_64.dll not found under VCToolsInstallDir"; exit 1; }
        echo "ASan runtime: $asan"
        { echo "$venv/Scripts"; find "$venv" -name '*.pyd' -exec dirname {} \; ; } | sort -u | while IFS= read -r d; do
          [ -d "$d" ] && cp -f "$asan" "$d/"
        done

    - name: Locate cdb
      if: inputs.asan == 'true' && inputs.runner-os == 'Windows'
      shell: bash
      run: |
        cdb="$(find '/c/Program Files (x86)/Windows Kits' -name cdb.exe -ipath '*debuggers/x64*' 2>/dev/null | head -1)"
        [ -n "$cdb" ] || { echo 'cdb.exe not found - Debugging Tools for Windows missing'; exit 1; }
        echo "CDB_PATH=$cdb" >> "$GITHUB_ENV"
        echo "cdb: $cdb"

    - name: Run test suite
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
        XX_TEST_STRICT: ${{ inputs.runner-os == 'Windows' && '0' || '1' }}
      # Core suite. asan-pytest.sh runs plain pytest when asan=false, and wraps it under the ASan
      # harness (LD_PRELOAD libasan on Linux, cdb on Windows) when asan=true. Shared with the
      # fin-base step below so both use the identical harness.
      run: bash .github/scripts/asan-pytest.sh "${{ inputs.asan }}" "${{ inputs.runner-os }}" asan

    # Downstream validation (same job, after core suite): install fin-base then run xx_fin tests.
    # Core isolation was asserted before the core suite; xxfin must be importable here. On ASan
    # nightlies XX_CXX_SANITIZERS stays ON so cxxfin is built WITH sanitizers, exactly like
    # py10x_kernel: it then takes the kernel's _add_sanitizers branch (skips RTLD stub generation)
    # and stays loadable next to the ASan-instrumented kernel. Building it normally instead would
    # dlopen the ASan kernel under a non-preloaded python and abort ("ASan runtime does not come
    # first"). On non-ASan builds XX_CXX_SANITIZERS is unset, so cxxfin is a normal build with stubs.
    - name: Install fin-base (--with-downstream)
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        python -m dev_10x.uv_sync py10x-dev --all-extras --with-downstream
        python -m dev_10x.env_check --downstream ${{ inputs.asan == 'true' && '--no-import' || '' }}

    # Run the fin-base tests through the same ASan harness as the core suite: importing cxxfin loads
    # the ASan-instrumented kernel, so it needs LD_PRELOAD (Linux) / cdb (Windows) too. pytest
    # collecting xx_fin/ imports xxfin and cxxfin, so a build/install regression surfaces here.
    - name: Run fin-base (xx_fin) tests
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
        XX_TEST_STRICT: ${{ inputs.runner-os == 'Windows' && '0' || '1' }}
      run: bash .github/scripts/asan-pytest.sh "${{ inputs.asan }}" "${{ inputs.runner-os }}" asan-fin xx_fin/
