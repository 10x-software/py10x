name: CI test suite
description: >-
  Install cxx siblings, verify constraints, MongoDB, Playwright, and run pytest.
  With asan=true, build the cxx10x backend under AddressSanitizer and run the
  suite under it (nightly memory-error diagnostics), capturing a symbolized C++
  report on any fault. With asan=false (default), build/test the standard
  release configuration.
inputs:
  python-version:
    description: Python version to install via uv
    required: true
    default: "3.12"
  mongodb-version:
    description: MongoDB major.minor for Linux (Docker) and Windows (preinstalled Server path)
    required: true
    default: "7.0"
  runner-os:
    description: Host runner OS from the calling workflow (Linux, Windows, or macOS)
    required: true
  asan:
    description: 'Build + run under AddressSanitizer ("true"/"false"). Nightly diagnostics only.'
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Setup Windows build
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-windows-build

    - name: Resolve corresponding cxx10x branch
      id: cxx10x_branch
      shell: bash
      run: |
        candidates=()
        [ -n "${{ github.head_ref }}" ] && candidates+=("${{ github.head_ref }}")
        if [ -n "${{ github.base_ref }}" ]; then
          candidates+=("${{ github.base_ref }}")
        else
          candidates+=("${{ github.ref_name }}")
        fi
        candidates+=("main")
        branch=$("${{ github.workspace }}/.github/scripts/resolve-sibling-branch.sh" \
          "https://github.com/10x-software/cxx10x.git" \
          "${candidates[@]}")
        echo "branch=$branch" >> "$GITHUB_OUTPUT"
        echo "Using cxx10x branch: $branch"

    - name: Checkout kernel/infra
      shell: bash
      run: |
        rm -rf ../cxx10x
        git clone --branch "${{ steps.cxx10x_branch.outputs.branch }}" \
          https://github.com/10x-software/cxx10x.git ../cxx10x

    - name: Enable AddressSanitizer build
      if: inputs.asan == 'true'
      shell: bash
      run: |
        # cxx10x cmake (_add_sanitizers) turns ENABLE_SANITIZERS into the right per-compiler flags
        # (/fsanitize=address + /Zi /EHsc /DEBUG on MSVC, -fsanitize=address on gcc). Keep the built
        # .pyd/.pdb in a persistent dir so the Windows step below can find the PDB for symbolization.
        echo "ENABLE_SANITIZERS=ON" >> "$GITHUB_ENV"
        echo "XX_UV_INCREMENTAL=1" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      env:
        WAIT_FOR_SIBLING_BRANCH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cxx10x_branch.outputs.branch || '' }}
      run: |
        uv venv
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        python -m dev_10x.uv_sync py10x-core-dev --all-extras

    # uv-sync applies -c constraints.txt on every install, so the test env is frozen. Assert every
    # installed third-party dist is pinned (catches a py10x or sibling dep that escaped the freeze).
    - name: Verify env is fully frozen against constraints.txt
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        xx-constraints check

    - name: Setup Mongo replica set
      uses: ./.github/actions/setup-mongo-replica-set
      with:
        mongodb-version: ${{ inputs.mongodb-version }}

    - name: Install Playwright chromium
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        playwright install --with-deps chromium

    - name: Stage ASan runtime + PDBs next to the .pyd
      if: inputs.asan == 'true' && inputs.runner-os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        venv="${GITHUB_WORKSPACE}/.venv"
        # 1) clang_rt.asan_dynamic runtime: Python 3.8+ does not search PATH for an extension's
        #    dependency DLLs (only system dirs, the exe dir, and the .pyd's own dir), so copy the
        #    runtime next to every built/installed .pyd and into the venv Scripts (exe) dir.
        asan="$(find "$VCToolsInstallDir" -name 'clang_rt.asan_dynamic-x86_64.dll' 2>/dev/null | head -1)"
        [ -n "$asan" ] || { echo "clang_rt.asan_dynamic-x86_64.dll not found under VCToolsInstallDir"; exit 1; }
        echo "ASan runtime: $asan"
        { echo "$venv/Scripts"; find "$venv" -name '*.pyd' -exec dirname {} \; ; } | sort -u | while IFS= read -r d; do
          [ -d "$d" ] && cp -f "$asan" "$d/"
        done
        # 2) Private PDBs: cxx10x installs py10x_*.pdb next to the .pyd, but stage a build-dir copy as
        #    a fallback so cdb resolves real C++ frames instead of nearest-export symbols.
        find "$venv/Lib/site-packages" -maxdepth 1 -name 'py10x_*.pyd' | while IFS= read -r pyd; do
          dir="$(dirname "$pyd")"; stem="$(basename "$pyd" | cut -d. -f1)"
          [ -e "$dir/$stem.pdb" ] && continue
          pdb="$(find "$venv" "${GITHUB_WORKSPACE}/../cxx10x" -name "${stem}*.pdb" 2>/dev/null | head -1 || true)"
          [ -n "$pdb" ] && cp -f "$pdb" "$dir/" && echo "staged $pdb -> $dir" || echo "no PDB for $stem"
        done

    - name: Locate cdb
      if: inputs.asan == 'true' && inputs.runner-os == 'Windows'
      shell: bash
      run: |
        cdb="$(find '/c/Program Files (x86)/Windows Kits' -name cdb.exe -ipath '*debuggers/x64*' 2>/dev/null | head -1)"
        [ -n "$cdb" ] || { echo 'cdb.exe not found - Debugging Tools for Windows missing'; exit 1; }
        echo "CDB_PATH=$cdb" >> "$GITHUB_ENV"
        echo "cdb: $cdb"

    - name: Run test suite
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
        # In-process fatal-error handler: prints the Python traceback (all threads) on a native crash.
        PYTHONFAULTHANDLER: "1"
        # Strict only where fully provisioned: Linux gets a replica set (transactions); Windows Mongo
        # is standalone by design, so the transaction gate must skip (not fail) there.
        XX_TEST_STRICT: ${{ inputs.runner-os == 'Windows' && '0' || '1' }}
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate

        # The scikit-build-core editable rebuild hook (enabled by XX_UV_INCREMENTAL on the ASan lane)
        # runs `cmake --build` on every `import py10x_kernel`. Its rebuild lock is Unix-only, so a
        # test that spawns concurrent child processes (Windows multiprocessing = re-import) races the
        # hook into a build-dir collision and one child exits non-zero. CI sources are frozen after
        # install, so disable import-time rebuilds: list each finder's build dir in the skip var it
        # honors. No-op on the release lane (rebuild hook not installed).
        export SKBUILD_EDITABLE_SKIP="$(python -c 'import sys,os; print(os.pathsep.join(f.path for f in sys.meta_path if type(f).__name__=="ScikitBuildRedirectingFinder" and getattr(f,"path",None)))')"

        # ---- Standard release build: just run the suite. ----
        if [ "${{ inputs.asan }}" != "true" ]; then
          python -m pytest
          exit $?
        fi

        # ---- AddressSanitizer run (nightly diagnostics). ----
        if [ "${{ inputs.runner-os }}" != "Windows" ]; then
          # Linux: LD_PRELOAD the ASan runtime (python itself is uninstrumented) plus the system
          # libstdc++ (so third-party manylinux wheels' C++ throws resolve __cxa_throw). Write ASan's
          # report to a file so it survives to the log; -v names the test running at an abort.
          mkdir -p asan
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libstdc++.so)"
          export ASAN_OPTIONS="detect_leaks=0:detect_odr_violation=0:alloc_dealloc_mismatch=0:halt_on_error=1:abort_on_error=0:log_path=asan/asan"
          # Drop the rio browser tests (XX_SKIP_RIO, honored by the root conftest): LD_PRELOAD is
          # inherited by every child process, so rio's browser client runs uninstrumented-under-ASan
          # and its tests time out; worse, rio's asyncio-atexit close then deadlocks
          # alt_pytest_asyncio's session teardown. rio exercises the browser, not the C++ kernel, so
          # this costs no memory-error coverage. (Windows ASan links the runtime into the .pyd -
          # nothing is preloaded into children - so it keeps rio.) `--ignore` can't do this: the
          # dev_10x pytest plugin force-collects every unit_tests dir and overrides it. Bound the run
          # regardless: SIGABRT drives PYTHONFAULTHANDLER to dump all threads' Python stacks (naming
          # any hang) before aborting. 124 == timed out.
          export XX_SKIP_RIO=1
          set +e; timeout --signal=ABRT 45m python -m pytest -v; code=$?; set -e
          [ "$code" = "124" ] && echo "::error::Linux ASan suite exceeded 45m wall clock (likely subprocess deadlock)"
          for f in asan/asan.*; do [ -e "$f" ] && { echo "===== ASan report: $f ====="; cat "$f"; }; done
          exit "$code"
        fi

        # Windows: ASan can report heap errors to a file, but a stack overflow leaves no stack for its
        # handler - so wrap pytest in cdb to catch native faults and print a symbolized C++ stack.
        # No minidump: the .dmp needs the exact matching binaries+PDBs to open, which we don't retain.
        mkdir -p asan_win
        export ASAN_OPTIONS="halt_on_error=1:abort_on_error=0:log_path=asan_win/asan"
        export _NT_SYMBOL_PATH="$(cygpath -w "$(dirname "$(find .venv -name 'py10x_kernel*.pyd' | head -1)")")"
        cdb="$(cygpath -u "$CDB_PATH")"
        bash_win="$(cygpath -w "$(command -v bash)")"
        rc_file="${RUNNER_TEMP}/pytest_rc"; rm -f "$rc_file"
        cmds="${RUNNER_TEMP}/cdb_cmds.txt"
        # Capture the faulting thread's exception + C++ stack between greppable banners. On a
        # first-chance stack-overflow (sov) also hand the exception back to the app (gN, after sxi
        # disables further breaks) so Python's faulthandler prints the Python traceback too; av/bpe
        # capture and kill.
        cap=".reload /f py10x_kernel*.pyd; .echo ===EXCEPTION===; .exr -1; .echo ===STACK BEGIN===; kP 400; .echo ===STACK END==="
        {
          # Silence the benign first-chance AV flood: Windows SEH and ASan's shadow-memory probes
          # raise many handled access violations during a normal run, which cdb would otherwise echo.
          # Real faults still surface - a stack overflow via sov, an ASan-detected error via its
          # __debugbreak (bpe), plus ASan's own report written to asan_win/asan.*.
          echo "sxi av"
          echo "sxe -c \"${cap}; .echo ===pass to app===; sxi sov; gN\" sov"
          echo "sxe -c \"${cap}; .kill; qq\" bpe"
          echo "g"
        } > "$cmds"
        "$cdb" -g -G -o -cf "$(cygpath -w "$cmds")" \
          "$bash_win" -c "cd '$(pwd)' && source .venv/Scripts/activate && python -m pytest -v; echo \$? > '${rc_file}'"
        code="$(cat "$rc_file" 2>/dev/null || echo 1)"
        for f in asan_win/asan.*; do [ -e "$f" ] && { echo "===== ASan report: $f ====="; cat "$f"; }; done
        echo "pytest exit code: ${code}"
        exit "${code}"
