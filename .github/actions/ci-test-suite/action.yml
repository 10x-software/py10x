name: CI test suite
description: >-
  Install cxx siblings, verify constraints, assert core isolation (xxfin absent),
  MongoDB, Playwright, run core pytest, then install fin-base (--with-downstream)
  and run xx_fin tests. With asan=true, build the cxx10x backend under
  AddressSanitizer and run the core suite under it (nightly memory-error
  diagnostics), capturing a symbolized C++ report on any fault. With asan=false
  (default), build/test the standard release configuration. Fin-base/cxxfin is
  always a normal (non-ASan) build in the downstream steps.
inputs:
  python-version:
    description: Python version to install via uv
    required: true
    default: "3.12"
  mongodb-version:
    description: MongoDB major.minor for Linux (Docker) and Windows (preinstalled Server path)
    required: true
    default: "7.0"
  runner-os:
    description: Host runner OS from the calling workflow (Linux, Windows, or macOS)
    required: true
  asan:
    description: 'Build + run under AddressSanitizer ("true"/"false"). Nightly diagnostics only.'
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Setup Windows build
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-windows-build

    - name: Resolve corresponding cxx10x branch
      id: cxx10x_branch
      shell: bash
      run: |
        candidates=()
        if [ -n "${{ github.head_ref }}" ]; then
          candidates+=("${{ github.head_ref }}")
        fi
        if [ -n "${{ github.base_ref }}" ]; then
          candidates+=("${{ github.base_ref }}")
        else
          candidates+=("${{ github.ref_name }}")
        fi
        candidates+=("main")
        branch=$("${{ github.workspace }}/.github/scripts/resolve-sibling-branch.sh" \
          "https://github.com/10x-software/cxx10x.git" \
          "${candidates[@]}")
        echo "branch=$branch" >> "$GITHUB_OUTPUT"
        echo "Using cxx10x branch: $branch"

    - name: Checkout kernel/infra
      shell: bash
      run: |
        rm -rf ../cxx10x
        git clone --branch "${{ steps.cxx10x_branch.outputs.branch }}" \
          https://github.com/10x-software/cxx10x.git ../cxx10x

    - name: Enable AddressSanitizer build
      if: inputs.asan == 'true'
      shell: bash
      run: |
        echo "ENABLE_SANITIZERS=ON" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      env:
        WAIT_FOR_SIBLING_BRANCH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cxx10x_branch.outputs.branch || '' }}
      run: |
        uv venv
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        python -m dev_10x.uv_sync py10x-core-dev --all-extras

    # uv-sync applies -c constraints.txt on every install, so the test env is frozen. Assert every
    # installed third-party dist is pinned (catches a py10x or sibling dep that escaped the freeze).
    - name: Verify env is fully frozen against constraints.txt
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        xx-constraints check

    # Core isolation: fin-base must not be importable until --with-downstream (after core pytest).
    - name: Assert xxfin not importable (core isolation)
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        python -c "import xxcommon; import importlib.util as u; assert u.find_spec('xxfin') is None, 'xxfin must not be importable in the core CI env'"

    - name: Verify the extension is ASan-instrumented
      if: inputs.asan == 'true'
      shell: bash
      run: |
        set -euo pipefail
        pyd="$(find .venv \( -name 'py10x_kernel*.pyd' -o -name 'py10x_kernel*.so' \) 2>/dev/null | head -1)"
        [ -n "$pyd" ] || { echo "py10x_kernel extension not found under .venv"; exit 1; }
        echo "extension: $pyd"
        if [ "${{ inputs.runner-os }}" = "Windows" ]; then
          # The instrumented .pyd imports clang_rt.asan_dynamic-x86_64.dll; the name sits in its
          # import table as a literal ASCII string.
          grep -aq 'clang_rt\.asan' "$pyd" || { echo "ERROR: not ASan-instrumented (no clang_rt.asan import)"; exit 1; }
        else
          # An instrumented .so references libasan's __asan_init interceptor as an undefined symbol.
          nm -D "$pyd" | grep -q '__asan_init' || { echo "ERROR: not ASan-instrumented (no __asan_init)"; exit 1; }
        fi
        echo "OK: extension is ASan-instrumented"

    - name: Setup Mongo replica set
      uses: ./.github/actions/setup-mongo-replica-set
      with:
        mongodb-version: ${{ inputs.mongodb-version }}

    - name: Setup PostgreSQL
      uses: ./.github/actions/setup-postgres

    - name: Install Playwright chromium
      shell: bash
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        playwright install --with-deps chromium

    - name: Stage ASan runtime next to the .pyd
      if: inputs.asan == 'true' && inputs.runner-os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        venv="${GITHUB_WORKSPACE}/.venv"
        # Python 3.8+ won't load an extension's dependency DLLs from PATH (only system/exe/.pyd dirs),
        # so copy the clang_rt ASan runtime next to every .pyd and the venv Scripts dir. (PDBs are
        # already installed beside each .pyd, so cdb symbolizes from there.)
        asan="$(find "$VCToolsInstallDir" -name 'clang_rt.asan_dynamic-x86_64.dll' 2>/dev/null | head -1)"
        [ -n "$asan" ] || { echo "clang_rt.asan_dynamic-x86_64.dll not found under VCToolsInstallDir"; exit 1; }
        echo "ASan runtime: $asan"
        { echo "$venv/Scripts"; find "$venv" -name '*.pyd' -exec dirname {} \; ; } | sort -u | while IFS= read -r d; do
          [ -d "$d" ] && cp -f "$asan" "$d/"
        done

    - name: Locate cdb
      if: inputs.asan == 'true' && inputs.runner-os == 'Windows'
      shell: bash
      run: |
        cdb="$(find '/c/Program Files (x86)/Windows Kits' -name cdb.exe -ipath '*debuggers/x64*' 2>/dev/null | head -1)"
        [ -n "$cdb" ] || { echo 'cdb.exe not found - Debugging Tools for Windows missing'; exit 1; }
        echo "CDB_PATH=$cdb" >> "$GITHUB_ENV"
        echo "cdb: $cdb"

    - name: Run test suite
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
        XX_TEST_STRICT: ${{ inputs.runner-os == 'Windows' && '0' || '1' }}
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate

        # ---- Standard release build: just run the suite. ----
        # pytest.ini enables -n auto --dist loadscope (xdist); unique py10x_test_* DBs per worker.
        if [ "${{ inputs.asan }}" != "true" ]; then
          python -m pytest
          exit $?
        fi

        # ---- AddressSanitizer run (nightly diagnostics). ----
        # Force -n0: ASan + LD_PRELOAD across many worker processes is flaky and hard to attribute.
        # Coverage belongs here (not on PR full-tests); enable with --cov when ready.
        export XX_DISABLE_STACKTRACE=1 # avoid any secondary errors
        if [ "${{ inputs.runner-os }}" != "Windows" ]; then
          # Linux: LD_PRELOAD libasan (python is uninstrumented) + system libstdc++ (so manylinux
          # wheels' C++ throws resolve __cxa_throw). ASan report -> file; -v names the aborting test.
          mkdir -p asan
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libstdc++.so)"
          export ASAN_OPTIONS="detect_leaks=0:detect_odr_violation=0:alloc_dealloc_mismatch=0:halt_on_error=1:abort_on_error=0:log_path=asan/asan"
          # rio's conftest strips LD_PRELOAD around the browser spawn so Chromium runs clean. Bound
          # the run: SIGABRT drives faulthandler (enabled in conftest) to dump all thread stacks on a hang.
          # 124 == timeout.
          set +e; timeout --signal=ABRT 45m python -m pytest -n0 -v; code=$?; set -e
          [ "$code" = "124" ] && echo "::error::Linux ASan suite exceeded 45m wall clock (likely subprocess deadlock)"
          for f in asan/asan.*; do [ -e "$f" ] && { echo "===== ASan report: $f ====="; cat "$f"; }; done
          exit "$code"
        fi

        # Windows: a stack overflow leaves ASan no stack to report, so wrap pytest in cdb to catch
        # native faults and print a symbolized C++ stack. No minidump (needs the matching binaries).
        mkdir -p asan_win
        export ASAN_OPTIONS="halt_on_error=1:abort_on_error=0:log_path=asan_win/asan"
        export _NT_SYMBOL_PATH="$(cygpath -w "$(dirname "$(find .venv -name 'py10x_kernel*.pyd' | head -1)")")"
        cdb="$(cygpath -u "$CDB_PATH")"
        bash_win="$(cygpath -w "$(command -v bash)")"
        rc_file="${RUNNER_TEMP}/pytest_rc"; rm -f "$rc_file"
        cmds="${RUNNER_TEMP}/cdb_cmds.txt"
        # Capture the faulting thread's exception + C++ stack between greppable banners. On stack
        # overflow (sov) also hand it back to the app (gN) so faulthandler prints the Python stack too.
        cap=".reload /f py10x_kernel*.pyd; .echo ===EXCEPTION===; .exr -1; .echo ===STACK BEGIN===; kP 400; .echo ===STACK END==="
        {
          # Stay out of the way of ASan's routine first-chance exceptions - its managed exception
          # 0xe0736170, guard-page AVs while it probes memory, ordinary C++ EH. ASan installs its
          # own handlers for these and recovers; the debugger must pass them straight through (sxi),
          # or ASan's startup fault stops being handled and turns fatal every run. (A blanket
          # second-chance catch-all was tried and did exactly that - it never caught this crash,
          # which dies without a second chance, and made ASan init crash deterministically.)
          echo "sxi av"
          echo "sxi eh"
          echo "sxe -c \"${cap}; .echo ===pass to app===; sxi sov; gN\" sov"
          echo "sxe -c \"${cap}; .kill; qq\" bpe"
          echo "g"
        } > "$cmds"
        # cdb exits non-zero on a caught fault; guard it so the step's `set -e` does not abort before
        # we dump ASan's own report (log_path) and the exit codes below - that abort is exactly why
        # earlier Windows ASan crashes produced no diagnostic at all.
        set +e
        "$cdb" -g -G -o -cf "$(cygpath -w "$cmds")" \
          "$bash_win" -c "cd '$(pwd)' && source .venv/Scripts/activate && python -m pytest -n0 -v; echo \$? > '${rc_file}'"
        cdb_rc=$?
        set -e
        code="$(cat "$rc_file" 2>/dev/null || true)"
        # A missing rc_file means pytest never returned - the process died under the debugger (an
        # ASan-init crash, a stack overflow, or bpe). Never let that fall through as success.
        [ -n "$code" ] || { echo "::error::pytest did not report an exit code (process terminated under the debugger)"; code="${cdb_rc:-1}"; [ "$code" = 0 ] && code=1; }
        for f in asan_win/asan.*; do [ -e "$f" ] && { echo "===== ASan report: $f ====="; cat "$f"; }; done
        echo "cdb exit: ${cdb_rc}; pytest exit code: ${code}"
        exit "${code}"

    # Downstream validation (same job, after core suite): install fin-base then run xx_fin tests.
    # Core isolation was asserted before the core suite; xxfin must be importable here.
    # Unset ENABLE_SANITIZERS so cxxfin is a normal build even on ASan nightlies (functional check).
    - name: Install fin-base (--with-downstream)
      shell: bash
      env:
        ENABLE_SANITIZERS: ""
        WAIT_FOR_SIBLING_BRANCH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cxx10x_branch.outputs.branch || '' }}
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        unset ENABLE_SANITIZERS
        python -m dev_10x.uv_sync py10x-core-dev --all-extras --with-downstream

    - name: Assert xxfin importable and run fin-base tests
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
        XX_TEST_STRICT: ${{ inputs.runner-os == 'Windows' && '0' || '1' }}
        ENABLE_SANITIZERS: ""
      run: |
        source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
        unset ENABLE_SANITIZERS
        python -c "import xxfin; import cxxfin; print(xxfin.__file__); print(cxxfin.__file__)"
        python -m pytest xx_fin/
