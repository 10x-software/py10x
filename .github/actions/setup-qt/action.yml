name: Setup Qt
description: >-
  Install the system libraries PyQt6 loads, for the headless Qt tests (ui_10x/qt6). No-op off Linux.
runs:
  using: composite
  steps:
    - name: Install Qt system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
