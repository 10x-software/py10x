name: wheels-py10x-fin-base

on:
  push:
    tags:
      # xx-promote publish triggers (same shape as cxx10x_wheels.yml).
      - "pre/py10x-fin-base-v*"
      - "prod/py10x-fin-base-v*"
  workflow_dispatch:

jobs:
  build_cxx_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true # repo is still private; cut wasted CI minutes on the other OSes once one fails
      matrix:
        # windows-2025 (not windows-latest): matches cxx10x_wheels.yml, which builds the exact
        # py10x-kernel wheel cxxfin links against.
        # windows-latest moved to VS2026/MSVC 19.5x in June 2026, ahead of the v143/14.44 toolset
        # Py10xMsvcVersion.cmake requires (see the matching cmake.args pin in cxxfin/pyproject.toml).
        os: [ubuntu-latest, macos-latest, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # cxxfin builds in isolation against whatever py10x-kernel pip resolves (build-system requires
      # py10x-kernel>=0.0.0rc0), i.e. the newest on PyPI - while this release's own kernel may still
      # be publishing. It must be that kernel: pybind11 types do not cross kernels built with
      # different pybind11 internals. So wait for it and constrain the build to it.
      # Untracked, so the setuptools-scm version stays clean.
      - name: Resolve coordinated py10x-kernel
        shell: bash
        env:
          PYPI_TIMEOUT_SEC: "1800"
          PYPI_POLL_SEC: "90"
        run: |
          set -euo pipefail
          : > cibw-constraints.txt
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python -m pip install -c constraints.txt packaging tomlkit
            python -m dev_10x.xx_ci downstream_build_constraints xx_fin/pyproject.toml cibw-constraints.txt
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: xx_fin/cxxfin
          output-dir: xx_fin/cxxfin/wheelhouse
        env:
          # The `build` frontend installs the isolated build env with pip, which reads PIP_CONSTRAINT:
          # host env on macOS / Windows; the project is copied to /project in the manylinux container.
          CIBW_BUILD_FRONTEND: "build"
          PIP_CONSTRAINT: ${{ github.workspace }}/cibw-constraints.txt
          CIBW_ENVIRONMENT_LINUX: "PIP_CONSTRAINT=/project/cibw-constraints.txt"
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=13.3'
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_34"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-py10x-fin-base-cxx-${{ matrix.os }}
          path: xx_fin/cxxfin/wheelhouse/*.whl

  build_finbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # py10x-fin-base and py10x-fin-base-cxx share one tag train / version. xx-promote writes
      # py10x-fin-base-cxx (==<version>) on the release commit (co-release forward pin). Editing it
      # here would dirty the tree (git describe --dirty) and yield an unpublishable +dirty version.
      # This step only validates the committed pin.
      - name: Validate py10x-fin-base-cxx pin matches the tagged version
        working-directory: xx_fin
        run: |
          VERSION=$(uvx --with hatch-vcs hatch version)
          echo "Resolved tagged version: $VERSION"
          if ! grep -qF "py10x-fin-base-cxx (==$VERSION)" pyproject.toml; then
            echo "::error::pyproject.toml's py10x-fin-base-cxx pin doesn't match the tagged version ($VERSION). xx-promote should have written py10x-fin-base-cxx (==$VERSION) on the release commit."
            grep py10x-fin-base-cxx pyproject.toml
            exit 1
          fi

      - name: Build py10x-fin-base sdist + wheel
        # Not a root workspace member — build from the packaging root.
        # --out-dir is relative to --directory, so point at the repo-root dist/ the
        # upload-artifact step (and smoke_test) expect.
        run: uv build --directory xx_fin --out-dir "${{ github.workspace }}/dist"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-py10x-fin-base
          path: dist/*

  smoke_test:
    needs: [build_cxx_wheels, build_finbase]
    timeout-minutes: 45
    strategy:
      fail-fast: true # repo is still private; cut wasted CI minutes on the other OSes once one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025] # must match build_cxx_wheels' matrix.os
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            dev_10x
            pyproject.toml
            constraints.txt
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: wheels-py10x-fin-base-cxx-${{ matrix.os }}
          path: dist-cxx

      - uses: actions/download-artifact@v8
        with:
          name: dist-py10x-fin-base
          path: dist-finbase

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Install straight from this run's build artifacts (not from PyPI) so a broken wheel is
      # caught here, before it's published (clean-venv smoke).
      # Coordinated py10x-core and its forward-pinned siblings may still be publishing — wait
      # for those exact versions on PyPI (not a blind pip-install retry).
      - name: Install from build artifacts
        shell: bash
        env:
          PYPI_TIMEOUT_SEC: "1800"
          PYPI_POLL_SEC: "90"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # dev_10x.xx_ci is kernel-free: needs only packaging + tomlkit, so it can resolve/wait
          # on PyPI before py10x-core itself is installed (same reasoning as build.yml's test job).
          pip install -c constraints.txt packaging tomlkit
          CXX_WHL=$(ls dist-cxx/*cp312*.whl | head -n1)
          FINBASE_WHL=$(ls dist-finbase/*.whl | head -n1)
          echo "cxx wheel: $CXX_WHL"
          echo "fin-base wheel: $FINBASE_WHL"
          echo "FINBASE_WHL=$FINBASE_WHL" >> "$GITHUB_ENV"
          python -m dev_10x.xx_ci wait_pypi_release_for_wheel "$FINBASE_WHL"
          # No --pre needed: release-wheel pins already force prerelease inclusion via PEP 440.
          # Brief retry: simple-index visibility can still lag a few seconds after the wait.
          for attempt in 1 2 3 4 5; do
            if pip install --no-cache-dir "$CXX_WHL" "$FINBASE_WHL"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "pip install failed (attempt $attempt); retrying in 30s..."
            sleep 30
          done

      # Passes a kernel BDateCurve into cxxfin: a cxxfin built against a kernel with different pybind11
      # internals still imports, but fails here with "incompatible function arguments".
      - name: Smoke test
        shell: bash
        run: |
          python - <<'EOF'
          import types

          import xxfin  # promotes py10x_kernel to RTLD_GLOBAL before cxxfin loads
          import cxxfin
          import py10x_kernel

          print(xxfin.__file__, cxxfin.__file__, py10x_kernel.__file__, sep='\n')
          simple = types.SimpleNamespace(name='SIMPLE')
          curve = py10x_kernel.BDateCurve()
          cxxfin.bootstrap_cash_deposit(curve, 0, 30, 1.0, 30 / 365, 30 / 360, simple, simple, 0.05, -1.0, 1.0, 1e-14)
          assert curve.times == [0, 30] and abs(curve.values[-1] - 0.05 * 365 / 360) < 1e-10, (curve.times, curve.values)
          print('cxxfin <-> py10x_kernel OK')
          EOF

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build_cxx_wheels, build_finbase, smoke_test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten distributions
        run: |
          mkdir -p upload
          find dist -name "*.whl" -exec cp {} upload/ \;
          find dist -name "*.tar.gz" -exec cp {} upload/ \;

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
