name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly at 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  # Push/PR runs supersede each other per ref (cancel-in-progress). Nightly/manual ASan runs are
  # long (~90m on Windows) and share this ref, so a routine push to main would otherwise cancel one
  # mid-run. Give schedule/workflow_dispatch runs a unique group (per run_id) and never cancel them.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  # PR / push: standard release build, Linux + Windows across the supported Python versions.
  full-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Full tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write  # dev-image push below (ubuntu-latest/py3.12 leg, push-to-main only)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        python: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history (0 = unlimited; default 1 is shallow): setuptools-scm versions kernel/infra from their older tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python }}
          cache-dependency-glob: |
            **/pyproject.toml

      - name: Run test suite
        uses: ./.github/actions/ci-test-suite
        with:
          python-version: ${{ matrix.python }}
          mongodb-version: "7.0"
          runner-os: ${{ runner.os }}
          asan: "false"

      # dev image: pushed to GHCR after the test suite. Built from source (`./xx-build init --mode
      # ci-release`, the build mode ci-test-suite uses) rather than reused from this leg's
      # .venv or PyPI: kernel/infra's published versions may not satisfy pyproject.toml's current
      # pin (a normal mid-development state). One leg only (ubuntu-latest/py3.12), and only on an
      # actual merge to main, not every PR run.
      - name: Log in to GHCR
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4

      - name: Compute short SHA
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: short_sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push dev image
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          push: true
          tags: |
            ghcr.io/10x-software/py10x-core:dev
            ghcr.io/10x-software/py10x-core:main-${{ steps.short_sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # PR / push: the C++ harness suites under cxx10x/tests (editable kernel/infra + core, standalone
  # Mongo), including the cross-module rebuild checks.
  cxx10x-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: cxx10x tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        python: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history (0 = unlimited; default 1 is shallow): setuptools-scm versions kernel/infra from their older tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python }}
          cache-dependency-glob: "**/pyproject.toml"

      - uses: ./.github/actions/cxx10x-tests
        with:
          python-version: ${{ matrix.python }}
          mongodb-version: "7.0"

  # PR / push: every way of installing the dev environment, verified by its result
  # (dev_10x/env_check.py: source tree, editable, rebuild-on-import, build type, imports) rather than
  # by exit codes - uv can quietly install something else than asked (e.g. the root's editable
  # sources overriding a build mode's settings). One venv walks the modes, so each switch's reinstall is
  # exercised too. No database needed, hence macOS as well.
  install-modes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Install modes (${{ matrix.os }}, py3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-latest]
    env:
      UV_PYTHON: "3.12"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history (0 = unlimited; default 1 is shallow): setuptools-scm versions kernel/infra from their older tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: install-modes
          cache-dependency-glob: "**/pyproject.toml"

      # No `uv python install`: UV_PYTHON (above) pins every uv call to 3.12, downloaded on first use.
      - uses: ./.github/actions/setup-windows-build

      # Fresh clone: `./xx-build init`, then plain `uv sync` keeps it as is (dev: Debug, rebuild-on-import).
      - name: "dev: ./xx-build init, then plain uv sync"
        run: |
          ./xx-build init
          ./xx-build show-mode
          uv run --no-sync python -m dev_10x.env_check dev --downstream
          uv sync
          uv run --no-sync python -m dev_10x.env_check dev --downstream

      # Each mode: set-mode rebuilds in order; plain `uv sync` then stays in the mode (env_check's default
      # mode is the one in uv.toml).
      - name: "./xx-build set-mode: dev-release, ci-release"
        run: |
          for mode in dev-release ci-release; do
            echo "::group::$mode"
            ./xx-build set-mode $mode
            ./xx-build show-mode
            uv run --no-sync python -m dev_10x.env_check --downstream
            uv sync
            uv run --no-sync python -m dev_10x.env_check $mode --downstream
            echo "::endgroup::"
          done

      # Docker's mode: built once, so its build dir can go.
      - name: "ci-release: imports without build/"
        run: |
          mv build build.moved
          uv run --no-sync python -m dev_10x.env_check ci-release --downstream
          mv build.moved build

      # The uv-sync compatibility wrapper (dev_10x/uv_sync.py), until it is retired: XX_UV_INSTALL_MODE ->
      # build mode, and without --with-downstream no fin-base.
      - name: "uv-sync wrapper"
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          for mode in editable incremental_quiet; do
            echo "::group::XX_UV_INSTALL_MODE=$mode"
            XX_UV_INSTALL_MODE=$mode python -m dev_10x.uv_sync py10x-dev --all-extras --with-downstream
            XX_UV_INSTALL_MODE=$mode python -m dev_10x.env_check --downstream
            echo "::endgroup::"
          done
          XX_UV_INSTALL_MODE=editable python -m dev_10x.uv_sync py10x-dev --all-extras
          XX_UV_INSTALL_MODE=editable python -m dev_10x.env_check
          python -c "import importlib.util as u; assert u.find_spec('xxfin') is None, 'xxfin installed without --with-downstream'"

      - name: "dev again: ./xx-build set-mode dev"
        run: |
          ./xx-build set-mode dev
          ./xx-build show-mode
          uv run --no-sync python -m dev_10x.env_check dev --downstream

      # now test we can start over clean with no issues
      - name: "./xx-build init --clean over an existing build/"
        run: |
          ./xx-build init --clean 2>&1 | tee "$RUNNER_TEMP/init-clean.log"
          if grep -q "does not match the project environment path" "$RUNNER_TEMP/init-clean.log"; then
            echo "::error::xx-build passed its own VIRTUAL_ENV to the inner uv calls"; exit 1
          fi
          uv run --no-sync python -m dev_10x.env_check dev --downstream

  # PR / push, Linux only, additive to (not part of) the full-tests matrix: builds the
  # functional-account container (docker/Dockerfile + docker/entrypoint.sh) and runs the
  # functional-account vault E2E test (core_10x/unit_tests/test_functional_account_vault.py)
  # inside it, under a *really* renamed OS account with a *really* mounted secrets file -- the
  # one boundary the plain pytest run in full-tests can't reach (OsUser.me is a C++ singleton,
  # not renameable in-process). See core_10x/functional_account_keyring.py's module docstring.
  functional-account-e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Functional-account vault E2E (container)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history (0 = unlimited; default 1 is shallow): setuptools-scm versions kernel/infra from their older tags

      - name: Setup PostgreSQL (host-side; the container reaches it via --network host)
        uses: ./.github/actions/setup-postgres

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # docker/Dockerfile's `dev` target builds this checkout together with its in-tree C++
      # siblings (cxx10x/) from source (`./xx-build init --mode ci-release`).
      - name: Build functional-account image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: py10x-functional-e2e
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E test inside the container (real OS-account rename + real keyring materialization)
        run: |
          secrets_dir="$(mktemp -d)"
          # mktemp -d defaults to mode 700 (owner-only) -- the container's renamed functional
          # account is a different, unrelated uid from the runner user that creates this dir, so
          # without opening it up the container can't even traverse into the bind mount, let
          # alone read the file inside. Not a real secret at this point (empty manifest --
          # entrypoint installs an empty backend; user_init populates it for real).
          chmod 755 "$secrets_dir"
          echo '[]' > "$secrets_dir/keyring.json"
          docker run --rm --network host \
            -e FUNCTIONAL_ACCOUNT_ID=xx-e2e-ci \
            -e XX_SECRETS_DIR=/secrets \
            -v "$secrets_dir:/secrets:ro" \
            py10x-functional-e2e

  # Nightly / manual: same matrix, built and run under AddressSanitizer for memory-error diagnostics.
  asan-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: ASan (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows runs the whole core suite under cdb plus the fin-base suite, both ASan-instrumented.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        python: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history (0 = unlimited; default 1 is shallow): setuptools-scm versions kernel/infra from their older tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python }}
          cache-dependency-glob: |
            **/pyproject.toml

      - name: Run test suite
        uses: ./.github/actions/ci-test-suite
        with:
          python-version: ${{ matrix.python }}
          mongodb-version: "7.0"
          runner-os: ${{ runner.os }}
          asan: "true"
