name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly at 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  # Push/PR runs supersede each other per ref (cancel-in-progress). Nightly/manual ASan runs are
  # long (~90m on Windows) and share this ref, so a routine push to main would otherwise cancel one
  # mid-run. Give schedule/workflow_dispatch runs a unique group (per run_id) and never cancel them.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  # PR / push: standard release build, Linux + Windows across the supported Python versions.
  full-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Full tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write  # dev-image push below (ubuntu-latest/py3.12 leg, push-to-main only)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        python: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python }}
          cache-dependency-glob: |
            **/pyproject.toml

      - name: Run test suite
        uses: ./.github/actions/ci-test-suite
        with:
          python-version: ${{ matrix.python }}
          mongodb-version: "7.0"
          runner-os: ${{ runner.os }}
          asan: "false"

      # dev image: pushed to GHCR after the test suite. Built from source (uv_sync
      # py10x-core-dev --all-extras, same as ci-test-suite) rather than reused from this leg's
      # .venv or PyPI: kernel/infra's published versions may not satisfy pyproject.toml's current
      # pin (a normal mid-development state), and a coordinated core+cxx10x PR needs its own
      # sibling source. One leg only (ubuntu-latest/py3.12), and only on an actual merge to main,
      # not every PR run. Reuses ../cxx10x from ci-test-suite's own "Checkout kernel/infra" step
      # above (same job, same runner) rather than cloning it again.
      - name: Log in to GHCR
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: short_sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push dev image
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          build-contexts: |
            cxx10x=../cxx10x
          push: true
          tags: |
            ghcr.io/10x-software/py10x-core:dev
            ghcr.io/10x-software/py10x-core:main-${{ steps.short_sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # PR / push, Linux only, additive to (not part of) the full-tests matrix: builds the
  # functional-account container (docker/Dockerfile + docker/entrypoint.sh) and runs the
  # functional-account vault E2E test (core_10x/unit_tests/test_functional_account_vault.py)
  # inside it, under a *really* renamed OS account with a *really* mounted secrets file -- the
  # one boundary the plain pytest run in full-tests can't reach (OsUser.me is a C++ singleton,
  # not renameable in-process). See core_10x/functional_account_keyring.py's module docstring.
  functional-account-e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Functional-account vault E2E (container)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve corresponding cxx10x branch
        id: cxx10x_branch
        run: |
          candidates=()
          if [ -n "${{ github.head_ref }}" ]; then
            candidates+=("${{ github.head_ref }}")
          fi
          if [ -n "${{ github.base_ref }}" ]; then
            candidates+=("${{ github.base_ref }}")
          else
            candidates+=("${{ github.ref_name }}")
          fi
          candidates+=("main")
          branch=$("${{ github.workspace }}/.github/scripts/resolve-sibling-branch.sh" \
            "https://github.com/10x-software/cxx10x.git" \
            "${candidates[@]}")
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # A full (non-shallow) clone: setuptools-scm needs real tag/history metadata to derive
      # py10x-kernel/py10x-infra's version, which BuildKit's own git build-context fetcher can't
      # supply (it fetches shallow, no tags) -- same reasoning as .git not being excluded from
      # this repo's own build context in .dockerignore.
      - name: Checkout kernel/infra
        run: |
          rm -rf ../cxx10x
          git clone --branch "${{ steps.cxx10x_branch.outputs.branch }}" \
            https://github.com/10x-software/cxx10x.git ../cxx10x

      - name: Setup PostgreSQL (host-side; the container reaches it via --network host)
        uses: ./.github/actions/setup-postgres

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker/Dockerfile's `dev` target builds this checkout together with its C++ siblings from
      # source (uv_sync py10x-core-dev --all-extras) -- the `cxx10x` build context below supplies
      # the sibling source from the full clone above.
      - name: Build functional-account image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          build-contexts: |
            cxx10x=../cxx10x
          tags: py10x-functional-e2e
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E test inside the container (real OS-account rename + real keyring materialization)
        run: |
          secrets_dir="$(mktemp -d)"
          echo '[]' > "$secrets_dir/keyring.json"  # entrypoint installs an empty backend; user_init populates it for real
          docker run --rm --network host \
            -e FUNCTIONAL_ACCOUNT_ID=xx-e2e-ci \
            -e XX_SECRETS_DIR=/secrets \
            -v "$secrets_dir:/secrets:ro" \
            py10x-functional-e2e

  # Nightly / manual: same matrix, built and run under AddressSanitizer for memory-error diagnostics.
  asan-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: ASan (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows runs the whole core suite under cdb plus the fin-base suite, both ASan-instrumented.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        python: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python }}
          cache-dependency-glob: |
            **/pyproject.toml

      - name: Run test suite
        uses: ./.github/actions/ci-test-suite
        with:
          python-version: ${{ matrix.python }}
          mongodb-version: "7.0"
          runner-os: ${{ runner.os }}
          asan: "true"
