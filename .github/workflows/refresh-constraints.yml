name: Refresh constraints

# Weekly "xx-upgrade": recompile the third-party freeze against the latest
# compatible PyPI graph (py10x + in-tree C++ siblings + downstreams). If
# constraints.txt changed,
# run the full test suite against the fresh pins and open a PR only when it
# passes. This job never commits to main itself, so the freeze stays
# review-gated and reproducible; a red run means an upstream release broke us.
on:
  schedule:
    # Weekly, Monday 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-constraints-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: Recompile and test constraints.txt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0   # full history (0 = unlimited; default 1 is shallow): setuptools-scm versions kernel/infra from their older tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml

      - name: Set up Python
        run: uv python install 3.12

      # Same env as ci-test-suite's core suite: build mode ci-release, without the fin-base groups.
      - name: Install dependencies
        run: ./xx-build init --mode ci-release --no-group test --no-group test-extras

      # One committed freeze: `uv lock --upgrade` (uv.lock covers every extra and dependency group,
      # downstreams included), then constraints.txt regenerated from it. The lock's change summary
      # goes into the PR description.
      - name: Upgrade uv.lock and regenerate constraints.txt
        run: |
          source .venv/bin/activate
          xx-constraints compile --upgrade --summary-file "$RUNNER_TEMP/lock-changes.txt"

      - name: Detect constraints change
        id: diff
        run: |
          if git diff --quiet -- constraints.txt uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "uv.lock and constraints.txt are unchanged - nothing to test or propose."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'summary<<LOCK_CHANGES_EOF'
              cat "$RUNNER_TEMP/lock-changes.txt"
              echo 'LOCK_CHANGES_EOF'
            } >> "$GITHUB_OUTPUT"
            git --no-pager diff -- constraints.txt
          fi

      # The remaining steps only run when the freeze actually moved; otherwise
      # the env is identical to what is already committed and tested.

      # Re-sync so the venv matches the freshly upgraded uv.lock before testing.
      - name: Re-sync against the upgraded uv.lock
        if: steps.diff.outputs.changed == 'true'
        run: uv sync --locked --no-group test --no-group test-extras

      - name: Verify env matches uv.lock
        if: steps.diff.outputs.changed == 'true'
        run: uv sync --locked --check --no-group test --no-group test-extras

      - name: Start MongoDB (single-node replica set)
        if: steps.diff.outputs.changed == 'true'
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "7.0"
          mongodb-replica-set: rs0
          mongodb-port: 27017

      - name: Start PostgreSQL (trust + password-auth)
        if: steps.diff.outputs.changed == 'true'
        uses: ./.github/actions/setup-postgres

      - name: Install Playwright chromium
        if: steps.diff.outputs.changed == 'true'
        run: |
          source .venv/bin/activate
          playwright install --with-deps chromium

      - name: Run full test suite
        if: steps.diff.outputs.changed == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          XX_TEST_STRICT: "1"   # fully-provisioned job: a guard that can't run is a defect, not a skip
        run: |
          source .venv/bin/activate
          pytest

      # Reaching here means the suite passed against the fresh pins. PRs opened
      # with GITHUB_TOKEN do NOT trigger ci.yml (GitHub blocks recursive workflow
      # runs); the App installation token below is required so the PR gets its
      # own CI run. Authored as the App bot, not a personal account.
      - name: Create GitHub App token
        if: steps.diff.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REFRESH_CONSTRAINTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_CONSTRAINTS_APP_PRIVATE_KEY }}
          # Scope the installation token to this repository only.
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # Labels are applied via the Issues API; needed so create-pull-request
          # can set `dependencies` / `automated` (and create them if missing).
          permission-issues: write

      - name: Open PR with the tested freeze
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            constraints.txt
            uv.lock
          branch: chore/refresh-constraints
          delete-branch: true
          commit-message: "chore: refresh constraints.txt"
          title: "chore: refresh constraints.txt"
          body: |
            Automated weekly refresh of the third-party dependency freeze.

            `xx-constraints compile --upgrade` upgraded `uv.lock` to the latest
            compatible PyPI graph of py10x-core, its in-tree C++ siblings
            (kernel/infra) and configured in-tree downstreams, and regenerated
            `constraints.txt` from it. The **full test suite passed** against the fresh
            pins in this workflow run. First-party packages are never pinned here.

            Review `constraints.txt` (one line per package); `uv.lock` is the same
            freeze in uv's format.

            Changes:
            ```
            ${{ steps.diff.outputs.summary }}
            ```
          labels: |
            dependencies
            automated
