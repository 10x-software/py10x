name: Publish py10x-core to PyPI (uv)
on:
  push:
    tags:
      - "pre/v*"
      - "prod/v*"
  workflow_dispatch:

jobs:
  # Pre-publish gate: the exact tagged commit must pass the suite (incl. the xx-promote PEP 440
  # assumption guards) before anything is published.
  test:
    name: Pre-publish tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Checkout kernel/infra
        run: git clone https://github.com/10x-software/cxx10x.git ../cxx10x

      # One venv on PATH for every later step; xx_ci needs only packaging + tomlkit (it is
      # kernel-free, so it can resolve tags before any sibling is installed).
      - name: Create venv + CI helper deps
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -c constraints.txt packaging tomlkit

      # Resolve each sibling to the tag its *pinned spec* admits (Form A dev pin -> latest rc on an
      # rc commit; final-only pin -> latest final on a release branch), then install that tagged
      # source from the local clone.
      - name: Resolve and install siblings at their pinned tags
        run: |
          KERNEL_TAG=$(python -m dev_10x.xx_ci latest_tag py10x-kernel)
          INFRA_TAG=$(python -m dev_10x.xx_ci latest_tag py10x-infra)
          echo "kernel -> $KERNEL_TAG ; infra -> $INFRA_TAG"
          CXX_ABS=$(cd "../cxx10x" && pwd)
          uv pip install -c constraints.txt \
            "py10x-kernel @ git+file://${CXX_ABS}@${KERNEL_TAG}#subdirectory=core_10x" \
            "py10x-infra  @ git+file://${CXX_ABS}@${INFRA_TAG}#subdirectory=infra_10x"

      - name: Install py10x-core + dev/test deps
        # Additive install: the siblings from the step above already satisfy py10x-core's specs, so
        # they are kept as-is (a `uv sync` would instead reconcile them back to the index and fail
        # on an unpublished rc). --all-extras already includes the dev extra.
        run: uv pip install -e . --all-extras --requirements pyproject.toml -c constraints.txt

      # Assert the env is fully frozen: every installed third-party dist (py10x-core's deps AND the
      # siblings' own deps) must be pinned in constraints.txt. Catches a dep that escaped the freeze.
      - name: Verify env is fully frozen against constraints.txt
        run: xx-constraints check

      # Now the kernel is installed in .venv: assert the installed version matches the tag we
      # resolved and that the compiled extension actually imports on this runner.
      - name: Verify installed siblings match their pinned tags
        run: |
          python -m dev_10x.xx_ci verify_sibling py10x-kernel
          python -m dev_10x.xx_ci verify_sibling py10x-infra

      - name: Start MongoDB (single-node replica set)
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "7.0"
          mongodb-replica-set: rs0
          mongodb-port: 27017

      - name: Setup PostgreSQL
        uses: ./.github/actions/setup-postgres

      # Install the browser with the runtime venv's pinned Playwright, so the browser revision always
      # matches the installed Playwright regardless of build caching (the pyproject build hook is a
      # no-op once the browser is cached).
      - name: Install Playwright chromium
        run: playwright install --with-deps chromium

      - name: Run test suite
        env:
          PYTHONUNBUFFERED: "1"
          XX_TEST_STRICT: "1"   # fully-provisioned job: a guard that can't run is a defect, not a skip
        run: pytest

  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-tags: true

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python
      run: uv python install 3.12

    - name: Build distributions
      run: uv build

    - name: Publish to PyPI
      run: uv publish

  # Publish the corresponding functional-account runtime image (docker/Dockerfile's `production`
  # target) to GHCR, tagged with the exact package version -- a plain `uv pip install
  # py10x-core==<version>` from the release just published above, no repo checkout baked into
  # the image, no rebuild-from-source.
  version:
    name: Derive release version
    needs: publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prod: ${{ steps.version.outputs.is_prod }}
    steps:
      - name: Derive package version from the publish-trigger tag
        id: version
        run: |
          # e.g. "pre/v1.2.3rc1" -> "1.2.3rc1" ; "prod/v1.2.3" -> "1.2.3"
          ref="${{ github.ref_name }}"
          release_tag="${ref#*/}"   # strip "pre/" or "prod/"
          version="${release_tag#v}"  # strip core's tag_prefix "v"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # :latest only tracks prod/ releases -- a pre/ (rc) publish must never move it, since
          # that would hand `docker pull ...:latest` an unstable build.
          if [[ "$ref" == prod/* ]]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi

  docker-image:
    name: Build and push image (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # dev_10x.xx_ci is kernel-free (same reasoning as the test job above): needs only
      # packaging + tomlkit, so it can resolve/wait on PyPI before py10x-core itself is installed.
      - name: Create venv + CI helper deps
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -c constraints.txt packaging tomlkit

      - name: Wait for the release to be resolvable on PyPI
        run: python -m dev_10x.xx_ci wait_pypi_release "${{ needs.version.outputs.version }}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          build-args: |
            PY10X_CORE_VERSION=${{ needs.version.outputs.version }}
            PY10X_CORE_EXTRAS=rio
          push: true
          tags: ghcr.io/10x-software/py10x-core:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=py10x-core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=py10x-core-${{ matrix.arch }}

  docker-image-manifest:
    name: Publish multi-arch manifest
    needs: [version, docker-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Combine per-arch images into one multi-arch tag
        run: |
          # :prod/:latest track the newest prod/ release; :pre tracks the newest pre/ (rc) release
          # -- so :pre can move on every rc without ever risking handing someone an unstable build
          # via :latest/:prod (those only ever move on an actual prod/ tag).
          tags=(-t "ghcr.io/10x-software/py10x-core:${{ needs.version.outputs.version }}")
          if [ "${{ needs.version.outputs.is_prod }}" = "true" ]; then
            tags+=(-t "ghcr.io/10x-software/py10x-core:latest")
            tags+=(-t "ghcr.io/10x-software/py10x-core:prod")
          else
            tags+=(-t "ghcr.io/10x-software/py10x-core:pre")
          fi
          docker buildx imagetools create "${tags[@]}" \
            ghcr.io/10x-software/py10x-core:${{ needs.version.outputs.version }}-amd64 \
            ghcr.io/10x-software/py10x-core:${{ needs.version.outputs.version }}-arm64
