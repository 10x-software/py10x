src = ["core_10x", "infra_10x", "ui_10x"]
line-length = 150
extend-exclude = ["cxx10x"]
# apply the excludes below to paths passed explicitly too (IDE plugins, pre-commit)
force-exclude = true

# Lint only, no formatter: the code is hand-formatted (`kw = value`, hand-aligned `=`, hand-ordered
# imports, `dict(...)`), which no Black-style formatter can keep. `ruff format` is a no-op here.
[format]
exclude = ["*"]

[lint]
# Rule selection = Ruff 0.16 defaults ∪ extend-select below.
# Do not replace `select` with full category letters (e.g. "S", "PL") — that enables
# non-default rules and silently widens CI. Cap the ruff version in pyproject.toml
# (`ruff>=0.13,<0.17`) so future default-set expansions do not change the gate unnoticed.
# Preview is on, but a preview rule is enabled only by its exact code in extend-select: a prefix ("E")
# never selects one, so E221/E241/E251 (hand alignment, `kw = value`), E201/E202, E226, E262/E265/E266
# (`#--`) and the E30x blank-line rules stay off. Preview also widens the default set (see the
# PLW0108/PT0xx ignores) and may change in any ruff release, uv.lock pins the version.
preview = true
explicit-preview-rules = true
ignore = [
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF013", # PEP 484 prohibits implicit `Optional`
    "E731",  # E731 Do not assign a `lambda` expression, use a `def`
    "N801",  # Class name should use CapWords convention
    "E501",  # Line too long
    "F401",  # Unused imports
    "I001",  # Import sort: import order is hand-managed (I001 is in the default set, so it must be ignored here)
    "C408",  # Unnecessary `dict()` call: kwargs-style dict(...) is house style
    "FLY002", # Static join to f-string: a multi-line '\n'.join(...) reads better than one long literal
    # Traitable eval's string annotations against the module dict. Moving names used in
    # trait annotations (e.g. `date`) under TYPE_CHECKING leaves undeclared names that
    # match the bare-identifier forward-ref path and break at runtime — keep TC* off.
    "TC001", # move application import into TYPE_CHECKING
    "TC002", # move third-party import into TYPE_CHECKING
    "TC003", # move standard-library import into TYPE_CHECKING
    # TODO: naive datetime policy — adopt timezone-aware APIs/tests when designed; until then silence DTZ*
    "DTZ001", # missing `tzinfo` parameter
    "DTZ003", # `datetime.datetime.utcnow()` used
    "DTZ005", # `datetime.datetime.now()` called without a `tz` argument
    "DTZ007", # Naive datetime constructed using `datetime.datetime.strptime()` without %z
    "DTZ011", # `datetime.date.today()` used
    # preview default set
    "PLW0108", # Lambda may be unnecessary: `lambda s: f(s)` rows in aligned tables are house style
    "PT028",   # Test function parameter with a default: run by hand with other values
    "PT012",   # `pytest.raises()` around a `with` body (store.transaction(), SaveIfChanged()) is intended
]
extend-select = [
  "TC", # type checking
  #"ANN", # annotations
  #"TID", # tidy imports
  "FA",  # future annotations
  "B",   # flake8-bugbear
  "PGH", # pygrep-hooks
  "RUF", # Ruff-specific
  "UP",  # pyupgrade
  "N",   # naming
  "F",   # pyflakes
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings: tabs, trailing whitespace, newline at end of file
  "C90", # complexity
  "Q",   # quotes: single inline (see lint.flake8-quotes), double for docstrings and multi-line strings
  # preview rules, by exact code
  # indentation of code; not E114-E116, which flag comments hand-placed under an inline comment
  # or beside the line they are an alternative to (`for cd in cash_depos:` / `# for cd in sofr_cash_depos:`)
  "E111", "E112", "E113", "E117",
  "E225", "E227", "E231", # missing whitespace around an operator, after `,` / `:`
  "E261", # two spaces before an inline comment
]
mccabe.max-complexity = 15 # Flag errors (`C901`) whenever the complexity level exceeds this
future-annotations = true # add "from __future__ import annotations" to enable more aggressive optimizations

exclude = [
    "core_10x/attic/*.py",
    "docs/notebooks/*.py",
    "core_10x/jit/*",
    "core_10x/callable_instrumentation.py",
    "ui_10x/qt6/table*.py",
    "xx_fin/xxfin/attic/jit_aadc/*.py",
]

[lint.flake8-quotes]
inline-quotes = "single"

[lint.per-file-ignores]
"xx_fin/xxfin/manual_tests/*" = [
    "B905", # zip without strict
    "B011", # assert False
]
"ui_10x/qt6/*" = [
    "B011",  # assert False
    "UP035", # deprecated typing import
]
"ui_10x/examples/price_simulator.py" = [
    "E711",   # != None
    "BLE001", # Do not catch blind exception: `Exception`
]
"ui_10x/rio/apps/examples/examples/pages/login_page.py" = [
    "BLE001", # Do not catch blind exception: `Exception`
]
# AST NodeVisitor hooks use visit_* CapWords
"core_10x/manual_tests/*" = [
    "N802", # Function name should be lowercase
]
# Qt-shaped ABC surface (setStretchLastSection / horizontalHeader)
"ui_10x/platform_interface.py" = [
    "N802", # Function name should be lowercase
]
# del of closed-over names at teardown confuses F821 on earlier nested uses
"ui_10x/rio/unit_tests/test_text4list.py" = [
    "F821", # Undefined name
]
# the `fresh` fixture yields test classes; the unpacked locals keep their class names
"core_10x/testlib/ts_store_transaction_tests.py" = [
    "N806", # Variable in function should be lowercase
]
"xxcommon/jit_aadc/*" = [
    "N802", # Function names should be lowercase
    "N815", # Variable in class scope should not be mixedCase
]
"xxcommon/*rdate.py" = [
    "N802", # Function names should be lowercase
]
"xxcommon/*event_processor.py" = [
    "N802", # Function names should be lowercase
]
"xxcommon/*curve.py" = [
    "N806", # Variable names should be lowercase
]
"xxcommon/roman_number.py" = [
    "E741", # Ambiguous variable name
]
"core_10x/xdate_time.py" = [
    "S110",   # `try`-`except`-`pass` detected, consider logging the exception
    "S112",   # `try`-`except`-`continue` detected, consider logging the exception
    "BLE001", # Do not catch blind exception: `Exception`
]
"core_10x/logger.py" = [
    "N802", # Function names should be lowercase
    "N805", # First argument of a method should be named `self`
]
"core_10x/apps/runme_1st_app.py" = [
    "F841", # Local variable `available_stores` is assigned to but never used
]
# staticmethod first arg intentionally named `cls` (operates on classes)
"core_10x/py_class.py" = [
    "PLW0211", # First argument of a static method should not be named `cls`
    "BLE001",  # Do not catch blind exception: `Exception`
]
"core_10x/package_refactoring.py" = [
    "PLW0211", # First argument of a static method should not be named `cls`
]
# intentional broad except → RC / UI teardown / best-effort paths
"core_10x/apps/user_status.py" = ["BLE001"]
"core_10x/concrete_traits.py" = ["BLE001"]
"core_10x/manual_tests/rc_test.py" = ["BLE001"]
"core_10x/sec_keys.py" = ["BLE001"]
"core_10x/trait.py" = [
    "BLE001", # Do not catch blind exception: `Exception`
    "S102",   # Use of `exec` detected — intentional for pybind docstring signatures
    "SIM102", # nested ifs kept for clarity in trait method wiring
]
"core_10x/traitable.py" = [
    "BLE001", # Do not catch blind exception: `Exception`
    "SIM102", # nested ifs kept for clarity in traitable hot paths
]
"core_10x/traitable_cli.py" = ["BLE001"]
"core_10x/vault_utils.py" = ["BLE001"]
"core_10x/basket.py" = ["SIM102"]
"infra_10x/ibis_store.py" = [
    "BLE001", # Do not catch blind exception: `Exception`
    "S110",   # `try`-`except`-`pass` detected, consider logging the exception
]
"infra_10x/mongodb_store.py" = [
    "BLE001", # Do not catch blind exception: `Exception`
]
"infra_10x/mongodb_admin.py" = ["SIM102"]
"ui_10x/choice.py" = ["BLE001"]
"ui_10x/py_data_browser.py" = [
    "BLE001", # Do not catch blind exception: `Exception`
    "S110",   # `try`-`except`-`pass` detected, consider logging the exception
]
"ui_10x/trait_widget.py" = ["BLE001"] # Qt/Mac teardown and RC conversion
"ui_10x/utils.py" = ["BLE001"]
"ui_10x/trait_editor.py" = ["SIM102"]
"core_10x/testlib/ts_store_isolation.py" = ["S110"]
# avoid drive-by NamedConstant refactor for one-over complexity budget
"core_10x/named_constant.py" = [
    "C901", # `__init_subclass__` is too complex (17 > 15)
]
# weakref capture in default is intentional for editor lifetime
"ui_10x/traitable_editor.py" = [
    "B008", # Do not perform function call `weakref.ref` in argument defaults
]
"xx_fin/*.py" = [
    "N802", # Function name should be lowercase
    "N806", # Variable in function should be lowercase
]
"xx_fin/xxfin/ccy_cross.py" = [
    "BLE001", # Do not catch blind exception: `Exception`
    "N815",   # Variable in class scope should not be mixedCase
]
"xx_fin/xxfin/dev_data_helpers/RUN_ME.py" = [
    "N999",   # Invalid module name: 'RUN_ME'
]
"xx_fin/xxfin/root_solver.py" = [
    "E701",   # Multiple statements on one line (colon)
    "BLE001", # Do not catch blind exception: `Exception`
]
"xx_fin/xxfin/*_curve.py" = [
    "E701",   # Multiple statements on one line (colon)
]
"xx_fin/xxfin/manual_tests/fin_instrument_test.py" = [
    "E701",   # Multiple statements on one line (colon)
]
"xx_fin/xxfin/*.py" = [
