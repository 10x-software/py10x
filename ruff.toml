line-length = 150
target-version = "py310"

[format]
quote-style = "single"
exclude = [
    "README.md",
    "GETTING_STARTED.md",
    "docs/notebooks/*.py",
    "core_10x/attic/*",
    "core_10x/jit/*",
    "core_10x/xnone.py",
    "core_10x/selectable_traitable_class.py",
    "core_10x/__init__.py",
    "core_10x/environment_variables.py",
    "core_10x/basket.py",
    "core_10x/logger.py",
    "core_10x/nucleus.py",
    "core_10x/named_constant.py",
    "core_10x/traitable.py",
    "core_10x/sec_keys.py",
    "core_10x/vault_utils.py",
    "core_10x/xinf.py",
    "core_10x/code_samples/*",
    "core_10x/manual_tests/*",
    "core_10x/experimental/*",
    "infra_10x/mongodb_store.py",
    "ui_10x/qt6/*",
    "ui_10x/examples/*",
    "ui_10x/py_data_browser.py",
    "ui_10x/choice.py",
    "ui_10x/utils.py",
    "ui_10x/traitable_editor.py",
    "xxcommon/xxcalendar.py",
    "xxcommon/roman_number.py",
    "xxcommon/rdate.py",
    "xxcommon/event_processor.py",
    "xxcommon/manual_tests/*",
    "xxcommon/README.md",
    "xxcommon/*_curve.py",
    "xx_fin/xxfin/*",
]

[lint]
# Rule selection = Ruff 0.16 defaults ∪ extend-select below.
# Do not replace `select` with full category letters (e.g. "S", "PL") — that enables
# non-default rules and silently widens CI. Cap the ruff version in pyproject.toml
# (`ruff>=0.13,<0.17`) so future default-set expansions do not change the gate unnoticed.
ignore = [
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF013", # PEP 484 prohibits implicit `Optional`
    "E731",  # E731 Do not assign a `lambda` expression, use a `def`
    "N801",  # Class name should use CapWords convention
    "E501",  # Line too long
    "F401",  # Unused imports
    # Traitable eval's string annotations against the module dict. Moving names used in
    # trait annotations (e.g. `date`) under TYPE_CHECKING leaves undeclared names that
    # match the bare-identifier forward-ref path and break at runtime — keep TC* off.
    "TC001", # move application import into TYPE_CHECKING
    "TC002", # move third-party import into TYPE_CHECKING
    "TC003", # move standard-library import into TYPE_CHECKING
    # TODO: naive datetime policy — adopt timezone-aware APIs/tests when designed; until then silence DTZ*
    "DTZ001", # missing `tzinfo` parameter
    "DTZ003", # `datetime.datetime.utcnow()` used
    "DTZ005", # `datetime.datetime.now()` called without a `tz` argument
    "DTZ007", # Naive datetime constructed using `datetime.datetime.strptime()` without %z
    "DTZ011", # `datetime.date.today()` used
]
extend-select = [
  "TC", # type checking
  #"ANN", # annotations
  #"TID", # tidy imports
  "FA",  # future annotations
  "B",   # flake8-bugbear
  "I",   # isort
  "PGH", # pygrep-hooks
  "RUF", # Ruff-specific
  "UP",  # pyupgrade
  "N",   # naming
  "F",   # pyflakes
  "E",   # pycodestyle
  "C90", # complexity
]
mccabe.max-complexity = 15 # Flag errors (`C901`) whenever the complexity level exceeds this
future-annotations = true # add "from __future__ import annotations" to enable more aggressive optimizations

exclude = [
    "core_10x/attic/*.py",
    "docs/notebooks/*.py",
    "core_10x/jit/*",
    "ui_10x/qt6/table*.py",
    "xx_fin/xxfin/jit_aadc/*",
]
[lint.per-file-ignores]
"xx_fin/xxfin/manual_tests/*" = [
    "B905", # zip without strict
    "B011", # assert False
]
"ui_10x/qt6/*" = ["B011","F401","I001","B007","UP035","E713","F541","F841","RUF023","UP006","UP037","UP04","B024","B027","E731","F402","F811","F821","RUF005","UP038","N816"]
"ui_10x/examples/*" = ["I001"]
"ui_10x/examples/price_simulator.py" = [
    "E711",   # != None
    "BLE001", # Do not catch blind exception: `Exception`
]
"ui_10x/rio/apps/examples/examples/pages/login_page.py" = [
    "BLE001", # Do not catch blind exception: `Exception`
]
"xxcommon/*rdate.py" = [
