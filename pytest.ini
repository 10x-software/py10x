[pytest]
python_classes  = Test[A-Z]*
# -n auto: one worker per CPU. --dist loadscope keeps module/class-scoped store
# fixtures on a single worker (required for TsStore / live_store isolation).
# Override with -n0 for pdb / serial debugging.
addopts         = -n auto --dist loadscope --cov-report=term-missing --cov-report=html
filterwarnings =
    ignore::DeprecationWarning
    default::DeprecationWarning:.*_10x.* 
    ignore:datetime.datetime.utcnow
    ignore:invalid escape sequence:SyntaxWarning:blpapi
