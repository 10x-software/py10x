[project]
name = "py10x-fin-base-cxx"
description = "10x Financial Domain Foundation (internals)"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["version"]

authors = [
    { name = "10X CONCEPTS LLC", email = "py10x@10x-software.org" },
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Development Status :: 3 - Alpha",
]

[build-system]
requires = [
    "scikit-build-core>=0.10.7",
    "setuptools-scm>=9.2.2",
    # Direct build dep: CMake imports py10x_kernel for version → FetchContent headers.
    # >=0.0.0rc0 admits current kernel prereleases (PEP 440). Not promote-managed.
    "py10x-kernel>=0.0.0rc0"
]

build-backend = "scikit_build_core.build"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
editable.rebuild = true
build-dir = "../../.venv/py10x-build/cxxfin/{build_type}/{wheel_tag}"

[tool.scikit-build.cmake.define]
ENABLE_SANITIZERS = {env = "ENABLE_SANITIZERS", default = "OFF"}

# Same pin as core_10x/infra_10x pyproject.toml (cxx10x): forces the exact MSVC toolset
# Py10xMsvcVersion.cmake requires (MSVC_VERSION=1944), regardless of whichever toolset the
# runner's default VS install currently points at.
[tool.cibuildwheel.windows.config-settings]
"cmake.args" = ["-T", "v143,version=14.44"]

[tool.setuptools_scm]
root = "../.."
git_describe_command = "git describe --dirty --tags --long --match 'py10x-fin-base-v*' --abbrev=40"
